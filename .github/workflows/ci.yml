name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - name: CLI smoke test
        run: |
          node bin/avant-la-nuit.js examples/chamonix-synthetic.gpx --start 2026-06-21T07:00:00+02:00
          node bin/avant-la-nuit.js examples/chamonix-synthetic.gpx --start 2026-10-25T12:30:00+01:00 || test $? -eq 2
